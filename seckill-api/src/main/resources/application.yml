spring:
  application:
    name: seckill-api
  mvc:
    servlet:
      load-on-startup: 1
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driverClassName: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/zhu_seckill?serverTimezone=Asia/Shanghai&characterEncoding=utf8&useSSL=false&zeroDateTimeBehavior=convertToNull
    username: root
    password: root
  redis:
    database: 5
    host: 127.0.0.1
    port: 6379
#    password:
    # Redis连接池配置
    lettuce:
      pool:
        # 连接池最大连接数（使用负值表示没有限制）
        max-active: 50
        # 连接池最大阻塞等待时间（使用负值表示没有限制）
        max-wait: -1
        # 连接池中的最大空闲连接
        max-idle: 20
        # 连接池中的最小空闲连接
        min-idle: 10
      # 关闭超时时间
      shutdown-timeout: 100ms
    # 连接超时时间
    connect-timeout: 10000ms
    # 读取超时时间
    timeout: 10000ms
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    cache: false
    content: text/html
    enabled: true
    encoding: UTF-8
    mode: HTML5
  elasticsearch:
    host: 127.0.0.1
    port: 9200
#    username: elastic
#    password:
  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: admin
    password: admin
server:
  port: 8015

seckill:
  orderTimeoutMinutes: 15
  orderTimeoutTopic: ORDER_TIMEOUT_TOPIC
  password:
    # RSA私钥（PKCS#8 DER Base64），与前端 jsencrypt 公钥配对；2026-09-07 用 openssl 生成
    privateKey: 

rocketmq:
  name-server: 127.0.0.1:9876
  producer:
    group: zhu-seckill-group
    # 增加发送超时时间到30秒
    send-message-timeout: 30000
    # 增加重试次数
    retry-times-when-send-failed: 3
    retry-times-when-send-async-failed: 3
    # 禁用VIP通道，避免端口映射问题
    vip-channel-enabled: false
    # 设置最大消息大小
    max-message-size: 4194304
    # 压缩消息体阈值
    compress-msg-body-over-howmuch: 4096
  # 客户端配置
  client:
    # 强制使用公网地址
    client-ip: 127.0.0.1
    # 增加客户端超时时间
    poll-name-server-interval: 30000
    heartbeat-broker-interval: 30000
    # 客户端异步发送线程池大小
    client-async-semaphore-value: 65535
    client-oneway-semaphore-value: 65535
  broker:
    address: 127.0.0.1:10911

snowflake:
  worker-id: 1
  datacenter-id: 1

