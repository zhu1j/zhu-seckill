<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>秒杀排队中</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #f8f9fa;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            line-height: 1.6;
            color: #212529;
            font-size: 14px;
        }
        
        /* 页面容器 */
        .page-container {
            min-height: 100vh;
            background: #f8f9fa;
            padding: 20px 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .main-wrapper {
            max-width: 600px;
            margin: 0 auto;
            padding: 0 20px;
            width: 100%;
        }
        
        /* 页面头部 */
        .page-header {
            background: white;
            border-radius: 8px;
            padding: 24px 32px;
            margin-bottom: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            border: 1px solid #e9ecef;
            text-align: center;
        }
        
        .page-title {
            font-size: 28px;
            font-weight: 600;
            color: #212529;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }
        
        .page-title i {
            color: #007bff;
        }
        
        /* 排队信息卡片 */
        .queue-card {
            background: white;
            border-radius: 8px;
            border: 1px solid #e9ecef;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            overflow: hidden;
            margin-bottom: 24px;
        }
        
        .card-header {
            background: #fff;
            padding: 24px 32px;
            border-bottom: 1px solid #e9ecef;
            text-align: center;
        }
        
        .queue-number {
            font-size: 48px;
            color: #dc3545;
            font-weight: 700;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .queue-text {
            font-size: 16px;
            color: #6c757d;
            margin-bottom: 0;
        }
        
        /* 进度区域 */
        .progress-section {
            padding: 32px;
            text-align: center;
        }
        
        .progress-container {
            margin: 24px 0;
        }
        
        .progress-bar {
            width: 100%;
            height: 24px;
            background: #e9ecef;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 16px;
            position: relative;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #28a745, #20c997);
            border-radius: 12px;
            transition: width 0.5s ease;
            position: relative;
        }
        
        .progress-fill::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            animation: shimmer 2s infinite;
        }
        
        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
        
        .progress-text {
            font-size: 18px;
            color: #212529;
            font-weight: 600;
            margin-bottom: 12px;
        }
        
        .estimated-time {
            font-size: 14px;
            color: #6c757d;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        /* 状态消息 */
        .status-message {
            padding: 20px 32px;
            border-radius: 8px;
            margin: 24px 0;
            font-size: 16px;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }
        
        .status-message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .status-message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .status-message.processing {
            background: #cce5ff;
            color: #004085;
            border: 1px solid #99d6ff;
        }
        
        /* 加载动画 */
        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #007bff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .pulse {
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        
        /* 响应式设计 */
        @media (max-width: 768px) {
            .main-wrapper {
                padding: 0 16px;
            }
            
            .page-header,
            .progress-section {
                padding: 20px 24px;
            }
            
            .card-header {
                padding: 20px 24px;
            }
            
            .queue-number {
                font-size: 36px;
            }
            
            .page-title {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="page-container">
            <div class="main-wrapper">
                <!-- 页面头部 -->
                <div class="page-header">
                    <h1 class="page-title">
                        <i class="fas fa-clock"></i>
                        秒杀排队中
                    </h1>
                </div>
                
                <!-- 排队信息卡片 -->
                <div class="queue-card">
                    <div class="card-header">
                        <div class="queue-number pulse">
                            <i class="fas fa-users"></i>
                            {{ queueCount }}
                        </div>
                        <p class="queue-text">人正在排队</p>
                    </div>
                    
                    <div class="progress-section">
                        <div class="progress-container">
                            <div class="progress-bar">
                                <div class="progress-fill" :style="{ width: progress + '%' }"></div>
                            </div>
                            <div class="progress-text">排队进度: {{ Math.floor(progress) }}%</div>
                            <div class="estimated-time">
                                <i class="fas fa-hourglass-half"></i>
                                预计等待时间: {{ estimatedTime }}
                            </div>
                        </div>
                        
                        <!-- 状态消息 -->
                        <div v-if="statusMessage" :class="['status-message', statusType]">
                            <div class="loading-spinner" v-if="statusType === 'processing'"></div>
                            <i v-else-if="statusType === 'success'" class="fas fa-check-circle"></i>
                            <i v-else-if="statusType === 'error'" class="fas fa-times-circle"></i>
                            {{ statusMessage }}
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const { createApp } = Vue;
        
        createApp({
            data() {
                const initialQueue = Math.floor(Math.random() * 601); // 生成一次随机数
                return {
                    progress: 0,
                    queueCount: initialQueue, // 使用同一个随机数
                    estimatedTime: '约2分钟',
                    statusMessage: '',
                    statusType: 'processing',
                    seckillProductId: null,
                    uuid: null,
                    code: null,
                    progressInterval: null,
                    checkInterval: null,
                    initialQueueCount: initialQueue, // 保存初始排队数量
                    startTime: null, // 记录开始时间
                    queueUpdateInterval: null // 排队数量更新定时器
                };
            },
            mounted() {
                // 获取URL参数
                const urlParams = new URLSearchParams(window.location.search);
                this.seckillProductId = urlParams.get('seckillProductId');
                this.uuid = urlParams.get('uuid');
                this.code = urlParams.get('code');
                
                // 开始排队进度
                this.startQueueProgress();
                
                // 8秒后开始检查秒杀结果
                setTimeout(() => {
                    this.startResultCheck();
                }, 8000);
            },
            beforeUnmount() {
                if (this.progressInterval) {
                    clearInterval(this.progressInterval);
                }
                if (this.checkInterval) {
                    clearInterval(this.checkInterval);
                }
                if (this.queueUpdateInterval) {
                    clearInterval(this.queueUpdateInterval);
                }
            },
            methods: {
                startQueueProgress() {
                    // 记录开始时间
                    this.startTime = Date.now();
                    this.statusMessage = '正在处理您的秒杀请求...';
                    this.statusType = 'processing';
                    
                    // 每2秒更新一次排队数量
                    this.queueUpdateInterval = setInterval(() => {
                        this.updateQueueCount();
                    }, 2000);
                },
                
                updateQueueCount() {
                    // 计算已经过去的时间（秒）
                    const elapsedSeconds = Math.floor((Date.now() - this.startTime) / 1000);
                    
                    // 每2秒减少一定比例的排队数量
                    const reductionRate = 0.15; // 每次减少15%
                    const reductions = Math.floor(elapsedSeconds / 2);
                    
                    // 计算当前排队数量
                    let currentQueue = this.initialQueueCount;
                    for (let i = 0; i < reductions; i++) {
                        currentQueue = Math.floor(currentQueue * (1 - reductionRate));
                    }
                    
                    this.queueCount = Math.max(0, currentQueue);
                    
                    // 根据排队数量变化计算进度
                    this.progress = Math.min(100, Math.floor((1 - this.queueCount / this.initialQueueCount) * 100));
                    
                    // 更新预计时间
                    this.updateEstimatedTime(elapsedSeconds);
                },
                
                updateEstimatedTime(elapsedSeconds) {
                    if (elapsedSeconds < 2) {
                        this.estimatedTime = '约2分钟';
                    } else if (elapsedSeconds < 4) {
                        this.estimatedTime = '约1分30秒';
                    } else if (elapsedSeconds < 6) {
                        this.estimatedTime = '约1分钟';
                    } else if (elapsedSeconds < 8) {
                        this.estimatedTime = '约30秒';
                    } else {
                        this.estimatedTime = '即将完成';
                    }
                },
                
                updateQueueInfo() {
                    // 这个方法现在由updateQueueCount替代，保留以防其他地方调用
                    // 根据进度更新排队人数和预计时间
                    this.queueCount = Math.max(0, Math.floor(this.initialQueueCount * (1 - this.progress / 100)));
                    
                    if (this.progress < 25) {
                        this.estimatedTime = '约2分钟';
                    } else if (this.progress < 50) {
                        this.estimatedTime = '约1分钟';
                    } else if (this.progress < 75) {
                        this.estimatedTime = '约30秒';
                    } else if (this.progress < 100) {
                        this.estimatedTime = '即将完成';
                    } else {
                        this.estimatedTime = '处理完成';
                        this.queueCount = 0;
                    }
                },
                
                startResultCheck() {
                    this.checkInterval = setInterval(() => {
                        this.checkSeckillResult();
                    }, 2000); // 每2秒检查一次结果
                },
                
                async checkSeckillResult() {
                    try {
                        const response = await axios.get('/getResult', {
                            params: {
                                seckillProductId: this.seckillProductId,
                                uuid: this.uuid,
                                code: this.code
                            },
                            headers: this.getHeaders()
                        });
                        
                        if (response.data) {
                            const result = response.data;
                            
                            // 根据处理状态判断结果
                            if (result.status === 1) {
                                // 处理成功
                                if (result.orderInfo && result.orderInfo.code) {
                                    this.handleSuccess(result.orderInfo.code);
                                }
                                // 清除排队更新定时器
                                if (this.queueUpdateInterval) {
                                    clearInterval(this.queueUpdateInterval);
                                }
                                return;
                            } else if (result.status === 2) {
                                // 处理失败
                                this.handleFailure(result.message || '秒杀失败');
                                // 清除排队更新定时器
                                if (this.queueUpdateInterval) {
                                    clearInterval(this.queueUpdateInterval);
                                }
                                return;
                            } else if (result.status === 0) {
                                // 还在排队中，更新状态信息
                                if (result.message) {
                                    this.statusMessage = result.message;
                                }
                                // 注意：排队数量由定时器控制，这里不需要更新
                            }
                        }
                        
                    } catch (error) {
                        console.log('检查结果中...', error);
                        
                        // 网络错误时保持当前状态，继续重试
                        if (error.response && error.response.status >= 500) {
                            this.statusMessage = '服务器繁忙，请稍候...';
                        }
                    }
                },
                
                handleSuccess(orderCode) {
                    clearInterval(this.checkInterval);
                    clearInterval(this.progressInterval);
                    
                    this.progress = 100;
                    this.queueCount = 0;
                    this.statusMessage = '恭喜您！秒杀成功，正在跳转到订单详情页面...';
                    this.statusType = 'success';
                    
                    // 2秒后跳转到订单详情页面
                    setTimeout(() => {
                        window.location.href = `/order/detail?orderCode=${orderCode}`;
                    }, 2000);
                },
                
                handleFailure(message) {
                    clearInterval(this.checkInterval);
                    clearInterval(this.progressInterval);
                    
                    this.progress = 100;
                    this.queueCount = 0;
                    this.statusMessage = message || '很遗憾，本次秒杀未成功，请关注下次活动！';
                    this.statusType = 'error';
                    
                    // 3秒后跳转回商品详情页面
                    setTimeout(() => {
                        window.location.href = `/product/detail?id=${this.seckillProductId}`;
                    }, 3000);
                },
                
                getHeaders() {
                    const token = this.getCookie('ZHU-TOKEN');
                    return token ? { 'Authorization': `Basic@${token}` } : {};
                },
                
                getCookie(name) {
                    const value = `; ${document.cookie}`;
                    const parts = value.split(`; ${name}=`);
                    if (parts.length === 2) return parts.pop().split(';').shift();
                    return null;
                }
            }
        }).mount('#app');
    </script>
</body>
</html>
