<<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>zhu秒杀 - 登录</title>
    <script type="text/javascript" th:src="@{/axios/axios.min.js}"></script>
    <script type="text/javascript" th:src="@{/vue/vue.min.js}"></script>
    <script type="text/javascript" th:src="@{/vue/jsencrypt.min.js}"></script>
    <style>
        .container { width: 400px; margin: 100px auto; padding: 30px; border: 1px solid #ddd; border-radius: 8px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; }
        .form-group input { width: 100%; padding: 8px; box-sizing: border-box; }
        .btn { width: 100%; padding: 10px; background: #e4393c; color: white; border: none; cursor: pointer; }
        .captcha-img { cursor: pointer; }
    </style>
</head>
<body>
<div id="app" class="container">
    <h2>zhu秒杀登录</h2>
    <div class="form-group">
        <label>用户名</label>
        <input v-model="username" placeholder="请输入用户名">
    </div>
    <div class="form-group">
        <label>密码</label>
        <input v-model="password" type="password" placeholder="请输入密码">
    </div>
    <div class="form-group">
        <label>验证码</label>
        <input v-model="code" placeholder="请输入验证码结果" style="width:60%">
        <img :src="captchaImg" @click="getCaptcha" class="captcha-img" style="vertical-align:middle">
    </div>
    <button class="btn" @click="doLogin">登 录</button>
    <p style="text-align:center;margin-top:10px">
        <a href="/register">还没有账号？去注册</a>
    </p>
</div>

<script>
    new Vue({
        el: '#app',
        data: {
            username: '', password: '', code: '',
            uuid: '', captchaImg: '',
            publicKey: 'MIGfMA0GCSqGSIb3DQEBAQUAA4GNADCBiQKBgQDF4E3jRLQEXuITk58qLk1r530ibQOfNWroYLRii4u78JVnWdiEglnm4fTIw16QKsjnh1cyPfFKqDDOUKWRC4i6JFWp7GcSwsrIEY+m5YyIZa3KhINJto0pJT0YicbKmgCa1+XAVOevQZsIVRsrLlPYkpd6lxWPeyWu75ZdAKXVUwIDAQAB'
        },
        created() { this.getCaptcha(); },
        methods: {
            encrypt(txt) {
                const encryptor = new JSEncrypt();
                encryptor.setPublicKey(this.publicKey);
                return encryptor.encrypt(txt);
            },
            getCaptcha() {
                axios.get('/code').then(res => {
                    this.uuid = res.data.uuid;
                    this.captchaImg = res.data.img;
                });
            },
            doLogin() {
                axios.post('/doLogin', {
                    uuid: this.uuid, username: this.username,
                    password: this.encrypt(this.password), code: this.code
                }).then(res => {
                    localStorage.setItem('token', res.data.token);
                    localStorage.setItem('username', res.data.username);
                    // 写入ZHU-TOKEN cookie：商品列表/详情/排队/支付等页面的请求头从该cookie读取
                    document.cookie = 'ZHU-TOKEN=' + res.data.token + '; path=/';
                    window.location.href = '/product/list';
                }).catch(err => {
                    alert(err.response?.data?.message || '登录失败');
                    this.getCaptcha();
                });
            }
        }
    });
</script>
</body>
</html>
