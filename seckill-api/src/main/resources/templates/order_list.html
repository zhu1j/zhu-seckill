<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>我的订单</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" th:href="@{/element-ui/index.css}" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <style type="text/css">
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #f8f9fa;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            line-height: 1.6;
            color: #212529;
            font-size: 14px;
        }
        
        /* 页面容器 */
        .page-container {
            min-height: 100vh;
            background: #f8f9fa;
            padding: 20px 0;
        }
        
        .main-wrapper {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0;
        }
        
        /* 页面头部 */
        .page-header {
            background: white;
            border-radius: 8px;
            padding: 24px 32px;
            margin-bottom: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            border: 1px solid #e9ecef;
            max-width: 1200px;
            margin-left: auto;
            margin-right: auto;
            margin-bottom: 24px;
        }
        
        .breadcrumb {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 16px;
            font-size: 14px;
            color: #6c757d;
        }
        
        .breadcrumb a {
            color: #007bff;
            text-decoration: none;
        }
        
        .breadcrumb a:hover {
            text-decoration: underline;
        }
        
        .page-title {
            font-size: 28px;
            font-weight: 600;
            color: #212529;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .page-title i {
            color: #007bff;
        }
        
        /* 筛选栏 */
        .filter-bar {
            background: white;
            border-radius: 8px;
            padding: 20px 32px;
            margin-bottom: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            border: 1px solid #e9ecef;
        }
        
        .filter-tabs {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        
        .filter-tab {
            padding: 8px 16px;
            border: 1px solid #e9ecef;
            border-radius: 20px;
            background: white;
            color: #6c757d;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        .filter-tab:hover {
            border-color: #007bff;
            color: #007bff;
            text-decoration: none;
        }
        
        .filter-tab.active {
            background: #007bff;
            border-color: #007bff;
            color: white;
        }
        
        /* 查询条件区域样式 */
        .search-section {
            background: white;
            border-radius: 8px;
            padding: 20px 32px;
            margin-bottom: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            border: 1px solid #e9ecef;
            max-width: 1200px;
            margin-left: auto;
            margin-right: auto;
        }
        
        .search-form-content {
            width: 100%;
        }
        
        .search-row {
            display: flex;
            align-items: center;
            gap: 24px;
            flex-wrap: wrap;
        }
        
        .search-item {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 200px;
        }
        
        .search-label {
            font-size: 14px;
            font-weight: 600;
            color: #495057;
            white-space: nowrap;
            min-width: 80px;
        }
        
        .search-select {
            padding: 8px 12px;
            border: 1px solid #dcdfe6;
            border-radius: 6px;
            font-size: 14px;
            background: white;
            transition: all 0.3s ease;
            min-width: 120px;
        }
        
        .search-input {
            padding: 8px 12px;
            border: 1px solid #dcdfe6;
            border-radius: 6px;
            font-size: 14px;
            background: white;
            transition: all 0.3s ease;
            min-width: 180px;
        }
        
        .search-input:focus,
        .search-select:focus {
            outline: none;
            border-color: #007bff;
            box-shadow: 0 0 0 2px rgba(0,123,255,0.25);
        }

        
        .search-item-wide {
            flex: 1;
            max-width: 400px;
        }
        
        .search-select:focus {
            outline: none;
            border-color: #007bff;
            box-shadow: 0 0 0 2px rgba(0,123,255,0.25);
        }
        
        .date-range-picker {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
        }
        
        .date-input {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid #dcdfe6;
            border-radius: 6px;
            font-size: 14px;
            background: white;
            transition: all 0.3s ease;
            min-width: 160px;
        }
        
        .date-input:focus {
            outline: none;
            border-color: #007bff;
            box-shadow: 0 0 0 2px rgba(0,123,255,0.25);
        }
        
        .date-separator {
            color: #6c757d;
            font-size: 14px;
            font-weight: 500;
            white-space: nowrap;
            padding: 0 4px;
        }
        
        .search-buttons {
            display: flex;
            gap: 12px;
            margin-left: auto;
        }
        
        .btn-search, .btn-reset {
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            text-decoration: none;
            transition: all 0.3s ease;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            border: none;
            min-width: 80px;
            justify-content: center;
        }
        
        .btn-search {
            background: #007bff;
            color: white;
        }
        
        .btn-search:hover {
            background: #0056b3;
            text-decoration: none;
            color: white;
            transform: translateY(-1px);
            box-shadow: 0 2px 8px rgba(0,123,255,0.3);
        }
        
        .btn-reset {
            background: #6c757d;
            color: white;
        }
        
        .btn-reset:hover {
            background: #545b62;
            text-decoration: none;
            color: white;
            transform: translateY(-1px);
            box-shadow: 0 2px 8px rgba(108,117,125,0.3);
        }
        
        /* 响应式设计 */
        @media (max-width: 768px) {
            .search-row {
                flex-direction: column;
                align-items: stretch;
                gap: 16px;
            }
            
            .search-item {
                flex-direction: column;
                align-items: stretch;
                min-width: auto;
            }
            
            .search-label {
                min-width: auto;
                margin-bottom: 4px;
            }
            
            .date-range-picker {
                flex-direction: column;
                gap: 12px;
            }
            
            .date-input {
                min-width: auto;
            }
            
            .search-buttons {
                margin-left: 0;
                justify-content: center;
            }
        }
        
        /* 订单列表 */
        .order-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-width: 1200px;
            margin-left: auto;
            margin-right: auto;
        }
        
        .order-card {
            background: white;
            border-radius: 8px;
            border: 1px solid #e9ecef;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            overflow: hidden;
            transition: all 0.3s ease;
        }
        
        .order-card:hover {
            box-shadow: 0 4px 16px rgba(0,0,0,0.1);
            transform: translateY(-2px);
        }
        
        .order-header {
            background: #fff;
            padding: 20px 32px;
            border-bottom: 1px solid #e9ecef;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }
        
        .order-info {
            display: flex;
            align-items: center;
            gap: 24px;
            flex-wrap: wrap;
        }
        
        .order-number {
            font-size: 16px;
            font-weight: 600;
            color: #212529;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .order-number i {
            color: #007bff;
        }
        
        .order-time {
            color: #6c757d;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .status-badge {
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 12px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .status-pending {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeaa7;
        }
        
        .status-paid {
            background: #cce5ff;
            color: #004085;
            border: 1px solid #99d6ff;
        }
        
        .status-completed {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .status-cancelled {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        /* 订单内容 */
        .order-content {
            padding: 24px 32px;
        }
        
        .product-display {
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }
        
        .product-image {
            width: 100px;
            height: 100px;
            border-radius: 8px;
            object-fit: cover;
            border: 1px solid #e9ecef;
            flex-shrink: 0;
        }
        
        .product-details {
            flex: 1;
            min-width: 0;
        }
        
        .product-name {
            font-size: 16px;
            font-weight: 600;
            color: #212529;
            margin-bottom: 8px;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        
        .product-specs {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 8px;
            margin-bottom: 16px;
        }
        
        .spec-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: #6c757d;
        }
        
        .spec-item i {
            color: #007bff;
            width: 14px;
        }
        
        .price-section {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid #f8f9fa;
        }
        
        .price-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .original-price {
            color: #6c757d;
            font-size: 14px;
            text-decoration: line-through;
        }
        
        .current-price {
            font-size: 18px;
            font-weight: 700;
            color: #dc3545;
        }
        
        .total-amount {
            font-size: 16px;
            font-weight: 600;
            color: #212529;
        }
        
        /* 操作按钮 */
        .order-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        
        .btn {
            padding: 8px 16px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 500;
            text-decoration: none;
            border: 1px solid;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        
        .btn-primary {
            background: #007bff;
            border-color: #007bff;
            color: white;
        }
        
        .btn-primary:hover {
            background: #0056b3;
            border-color: #0056b3;
            color: white;
            text-decoration: none;
        }
        
        .btn-outline {
            background: white;
            border-color: #6c757d;
            color: #6c757d;
        }
        
        .btn-outline:hover {
            background: #6c757d;
            color: white;
            text-decoration: none;
        }
        
        .btn-success {
            background: #28a745;
            border-color: #28a745;
            color: white;
        }
        
        .btn-success:hover {
            background: #1e7e34;
            border-color: #1e7e34;
            color: white;
            text-decoration: none;
        }
        
        /* 空状态 */
        .empty-state {
            text-align: center;
            padding: 80px 20px;
            background: white;
            border-radius: 8px;
            border: 1px solid #e9ecef;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        
        .empty-icon {
            font-size: 64px;
            color: #e9ecef;
            margin-bottom: 16px;
        }
        
        .empty-title {
            font-size: 18px;
            font-weight: 600;
            color: #6c757d;
            margin-bottom: 8px;
        }
        
        .empty-description {
            color: #6c757d;
            margin-bottom: 24px;
        }
        
        /* 分页样式 - 与商品列表页面保持一致 */
        .pagination {
            display: flex;
            justify-content: center;
            margin-top: 20px;
            max-width: 1200px;
            margin-left: auto;
            margin-right: auto;
        }
        
        /* 优化分页样式 - 参考商品列表页面 */
        .el-pagination {
            padding: 20px 0;
        }
        
        .el-pagination .el-pager li {
            background-color: #fff;
            border: 1px solid #dcdfe6;
            border-radius: 4px;
            margin: 0 2px;
            transition: all 0.3s ease;
        }
        
        .el-pagination .el-pager li:hover {
            color: #409eff;
            border-color: #409eff;
            transform: translateY(-1px);
            box-shadow: 0 2px 8px rgba(64, 158, 255, 0.2);
        }
        
        .el-pagination .el-pager li.active {
            background-color: #409eff;
            border-color: #409eff;
            color: #fff;
            font-weight: 600;
        }
        
        .el-pagination .btn-prev,
        .el-pagination .btn-next {
            background-color: #fff;
            border: 1px solid #dcdfe6;
            border-radius: 4px;
            transition: all 0.3s ease;
        }
        
        .el-pagination .btn-prev:hover,
        .el-pagination .btn-next:hover {
            color: #409eff;
            border-color: #409eff;
            transform: translateY(-1px);
            box-shadow: 0 2px 8px rgba(64, 158, 255, 0.2);
        }
        
        .el-pagination .el-select .el-input {
            width: 100px;
        }
        
        .el-pagination .el-select .el-input__inner {
            border-radius: 4px;
            transition: all 0.3s ease;
        }
        
        .el-pagination .el-select .el-input__inner:hover {
            border-color: #409eff;
        }
        
        /* 响应式设计 */
        @media (max-width: 768px) {
            .main-wrapper {
                padding: 0 16px;
            }
            
            .page-header,
            .filter-bar,
            .order-header,
            .order-content {
                padding: 16px 20px;
            }
            
            .product-display {
                flex-direction: column;
                gap: 16px;
            }
            
            .product-image {
                width: 80px;
                height: 80px;
            }
            
            .product-specs {
                grid-template-columns: 1fr;
            }
            
            .price-section {
                flex-direction: column;
                align-items: flex-start;
            }
            
            .order-actions {
                width: 100%;
                justify-content: flex-end;
            }
            
            .filter-tabs {
                justify-content: center;
            }
        }
        
        @media (max-width: 480px) {
            .page-title {
                font-size: 24px;
            }
            
            .order-info {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }
            
            .order-actions {
                flex-direction: column;
                width: 100%;
            }
            
            .btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>

<body>
    <div class="page-container">
        <div class="main-wrapper">
            <!-- 页面头部 -->
            <div class="page-header">
                <div class="breadcrumb">
                    <i class="fas fa-home"></i>
                    <a href="/" style="color: #007bff; text-decoration: none;">首页</a>
                    <i class="fas fa-chevron-right"></i>
                    <span>我的订单</span>
                </div>
                <h1 class="page-title">
                    <i class="fas fa-shopping-bag"></i>
                    我的订单
                </h1>
            </div>
            
            <!-- 查询条件区域 -->
                <div class="search-section">
                    <div class="search-form">
                        <div class="search-form-content">
                            <div class="search-row">
                                <div class="search-item">
                                    <label class="search-label">订单号：</label>
                                    <input type="text" v-model="searchParams.orderNo" class="search-input" 
                                           placeholder="请输入订单号" />
                                </div>
                                <div class="search-item">
                                    <label class="search-label">商品名称：</label>
                                    <input type="text" v-model="searchParams.productName" class="search-input" 
                                           placeholder="请输入商品名称" />
                                </div>
                                <div class="search-item">
                                    <label class="search-label">订单状态：</label>
                                    <select v-model="searchParams.status" class="search-select">
                                        <option value="">全部状态</option>
                                        <option value="1">待支付</option>
                                        <option value="2">已支付</option>
                                        <option value="3">已完成</option>
                                        <option value="4">已取消</option>
                                    </select>
                                </div>
                            </div>
                            <div class="search-row">
                                <div class="search-item search-item-wide">
                                    <label class="search-label">下单时间：</label>
                                    <el-date-picker
                                        v-model="searchParams.timeRange"
                                        type="datetimerange"
                                        range-separator="至"
                                        start-placeholder="开始时间"
                                        end-placeholder="结束时间"
                                        size="small"
                                        format="yyyy-MM-dd HH:mm"
                                        value-format="yyyy-MM-dd HH:mm:ss"
                                        style="width: 100%;">
                                    </el-date-picker>
                                </div>
                                <div class="search-buttons">
                                    <button type="button" class="btn-search" @click="handleSearch">
                                        <i class="fas fa-search"></i>
                                        查询
                                    </button>
                                    <button type="button" class="btn-reset" @click="handleReset">
                                        <i class="fas fa-undo"></i>
                                        重置
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- 订单列表 -->
            <div class="order-list" th:if="${not #lists.isEmpty(orderList)}">
                <div class="order-card" th:each="order : ${orderList}">
                    <div class="order-header">
                        <div class="order-info">
                            <div class="order-number">
                                <i class="fas fa-receipt"></i>
                                订单号：<span th:text="${order.code}">202410050001</span>
                            </div>
                            <div class="order-time">
                                <i class="fas fa-calendar-alt"></i>
                                <span th:text="${#dates.format(order.orderTime, 'yyyy-MM-dd HH:mm')}">2024-10-05 10:30</span>
                            </div>
                        </div>
                        <div class="status-badge" 
                             th:classappend="${order.orderStatus == 1} ? 'status-pending' : 
                                           (${order.orderStatus == 2} ? 'status-paid' : 
                                           (${order.orderStatus == 3} ? 'status-completed' : 'status-cancelled'))">
                            <span th:text="${order.orderStatus == 1} ? '待支付' : 
                                          (${order.orderStatus == 2} ? '已支付' : 
                                          (${order.orderStatus == 3} ? '已完成' : '已取消'))">待支付</span>
                        </div>
                    </div>
                    
                    <div class="order-content">
                        <div class="product-display">
                            <img class="product-image" 
                                 th:src="${order.cover}" 
                                 th:alt="${order.productName}"
                                 onerror="this.src='/images/default-product.jpg'" />
                            
                            <div class="product-details">
                                <div class="product-name" th:text="${order.productName}">iPhone 15 Pro Max 256GB 深空黑色</div>
                                
                                <div class="product-specs">
                                    <div class="spec-item">
                                        <i class="fas fa-tag"></i>
                                        <span>商品ID: <span th:text="${order.productId}">10001</span></span>
                                    </div>
                                    <div class="spec-item">
                                        <i class="fas fa-shopping-cart"></i>
                                        <span>数量: <span th:text="${order.quantity}">1</span>件</span>
                                    </div>
                                    <div class="spec-item">
                                        <i class="fas fa-user"></i>
                                        <span>用户名称: <span th:text="${order.userName}">用户名</span></span>
                                    </div>
                                    <div class="spec-item">
                                        <i class="fas fa-barcode"></i>
                                        <span>交易ID: <span th:text="${order.id}">1875545223153160192</span></span>
                                    </div>
                                </div>
                                
                                <div class="price-section">
                                    <div class="price-info">
                                        <span class="original-price" th:if="${order.costPrice != order.price}">
                                            原价: ¥<span th:text="${#numbers.formatDecimal(order.costPrice, 0, 2)}">8999.00</span>
                                        </span>
                                        <span class="current-price">
                                            ¥<span th:text="${#numbers.formatDecimal(order.price, 0, 2)}">6999.00</span>
                                        </span>
                                        <span class="total-amount">
                                            总计: ¥<span th:text="${#numbers.formatDecimal(order.totalAmount, 0, 2)}">6999.00</span>
                                        </span>
                                    </div>
                                    
                                    <div class="order-actions">
                                        <a th:href="@{/order/detail?orderCode={orderCode}(orderCode=${order.code})}" class="btn btn-outline">
                                            <i class="fas fa-eye"></i>
                                            查看详情
                                        </a>
                                        <a th:if="${order.orderStatus == 1}" 
                                           th:href="@{/payment?orderCode={orderCode}(orderCode=${order.code})}"
                                           class="btn btn-success">
                                            <i class="fas fa-credit-card"></i>
                                            立即支付
                                        </a>
                                        <a th:if="${order.orderStatus == 1}" 
                                           href="#" 
                                           class="btn btn-outline"
                                           onclick="cancelOrder(this)"
                                           th:data-order-code="${order.code}">
                                            <i class="fas fa-times"></i>
                                            取消订单
                                        </a>
                                        <a th:if="${order.orderStatus == 2}" 
                                           href="#" 
                                           class="btn btn-primary">
                                            <i class="fas fa-truck"></i>
                                            查看物流
                                        </a>
                                        <a th:if="${order.orderStatus == 3}" 
                                           href="#" 
                                           class="btn btn-outline">
                                            <i class="fas fa-redo"></i>
                                            再次购买
                                        </a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- 空状态 -->
            <div class="empty-state" th:if="${#lists.isEmpty(orderList)}">
                <div class="empty-icon">
                    <i class="fas fa-shopping-bag"></i>
                </div>
                <div class="empty-title">暂无订单</div>
                <div class="empty-description">您还没有任何订单，快去选购心仪的商品吧！</div>
                <a href="/product/list" class="btn btn-primary">
                    <i class="fas fa-shopping-cart"></i>
                    去购物
                </a>
            </div>
            
            <!-- 分页 - 使用Element UI分页组件 -->
            <div class="pagination" th:if="${not #lists.isEmpty(orderList)}" style="max-width: 1200px; margin: 0 auto; padding: 20px 0;">
                <el-pagination
                    @size-change="sizeChange"
                    @current-change="pageChange"
                    :current-page="currentPage"
                    :page-sizes="[10, 20, 50, 100]"
                    :page-size="pageSize"
                    layout="total, sizes, prev, pager, next, jumper"
                    :total="totalCount"
                    :pager-count="7">
                </el-pagination>
            </div>
        </div>
    </div>
    
    <script src="https://unpkg.com/vue@2/dist/vue.js"></script>
<script src="https://unpkg.com/element-ui/lib/index.js"></script>
<script src="https://unpkg.com/axios/dist/axios.min.js"></script>
<script type="text/javascript" th:src="@{/js/login-check.js}"></script>
    <script>
        // Vue.js 应用 - 与商品列表页面保持一致
        new Vue({
            el: '.page-container',
            data: {
                // 分页相关数据
                currentPage: [[${currentPage}]] || 1,
                pageSize: [[${pageSize}]] || 10,
                totalCount: [[${totalCount}]] || 0,
                
                // 查询条件
                searchParams: {
                    orderNo: /*[['${orderNo}']]*/  '',
                    productName: /*[['${productName}']]*/  '',
                    status: /*[['${status}']]*/  '',
                    timeRange: null // Element UI 时间范围选择器的值
                }
            },
            methods: {
                // 每页显示数量改变
                sizeChange: function(newSize) {
                    this.pageSize = newSize;
                    this.currentPage = 1; // 重置到第一页
                    this.getPage();
                },
                
                // 当前页改变
                pageChange: function(newPage) {
                    this.currentPage = newPage;
                    this.getPage();
                },
                
                // 查询按钮点击事件
                handleSearch: function(event) {
                    event.preventDefault();
                    this.currentPage = 1; // 重置到第一页
                    this.getPage();
                },
                
                // 重置查询条件
                handleReset: function(event) {
                    event.preventDefault();
                    this.searchParams.orderNo = '';
                    this.searchParams.productName = '';
                    this.searchParams.status = '';
                    this.searchParams.timeRange = null;
                    this.currentPage = 1;
                    window.location.href = '/order/list';
                },
                
                // 格式化时间用于表单提交
                formatTimeForSubmit: function(timeRange, index) {
                    if (!timeRange || !timeRange[index]) return '';
                    const date = new Date(timeRange[index]);
                    return date.toISOString().slice(0, 19).replace('T', ' ');
                },
                
                // 获取分页数据
                getPage: function() {
                    var params = new URLSearchParams();
                    if (this.searchParams.orderNo) params.append('orderNo', this.searchParams.orderNo);
                    if (this.searchParams.productName) params.append('productName', this.searchParams.productName);
                    if (this.searchParams.status) params.append('status', this.searchParams.status);
                    
                    // 处理时间范围参数
                if (this.searchParams.timeRange && this.searchParams.timeRange.length === 2) {
                    params.append('startTime', this.searchParams.timeRange[0]);
                    params.append('endTime', this.searchParams.timeRange[1]);
                }
                    
                    params.append('pageNo', this.currentPage);
                    params.append('pageSize', this.pageSize);
                    
                    window.location.href = '/order/list?' + params.toString();
                }
            },
            mounted: function() {
                // 初始化时间范围值（如果有的话）
                const startTime = /*[['${startTime}']]*/  '';
                const endTime = /*[['${endTime}']]*/  '';
                
                if (startTime && endTime) {
                    this.searchParams.timeRange = [startTime, endTime];
                }
            }
        });
        
        // 取消订单功能
        function cancelOrder(element) {
            const orderCode = element.getAttribute('data-order-code');
            if (!orderCode) {
                alert('订单编号不能为空');
                return;
            }
            
            if (confirm('确定要取消这个订单吗？')) {
                // 这里可以添加取消订单的AJAX请求
                fetch('/order/cancel', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ orderCode: orderCode })
                })
                .then(response => response.json())
                .then(data => {
                    // 直接检查返回的布尔值
                    if (data) {
                        alert('订单已取消');
                        location.reload();
                    } else {
                        alert('取消订单失败');
                    }
                })
                .catch(error => {
                    LoginChecker.handleApiError(error);
                });
            }
        }
    </script>
</body>
</html>
