<!DOCTYPE html>
<html>
<head>
    <title>测试错误处理</title>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <script type="text/javascript" src="/js/login-check.js"></script>
</head>
<body>
    <h1>测试错误处理</h1>
    <button onclick="testError()">测试403错误</button>
    <div id="result"></div>
    
    <script>
        function testError() {
            console.log('开始测试403错误...');
            
            axios.post("/searchProductList", {pageNo:1, pageSize:10}, {
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Basic@invalid-token'
                }
            })
            .then(res => {
                console.log('成功响应:', res);
                document.getElementById('result').innerHTML = '成功: ' + JSON.stringify(res.data);
            })
            .catch(error => {
                console.log('捕获到错误:', error);
                console.log('错误类型:', typeof error);
                console.log('error.response:', error.response);
                console.log('error.response.status:', error.response ? error.response.status : 'undefined');
                console.log('error.response.data:', error.response ? error.response.data : 'undefined');
                
                // 测试LoginChecker.handleApiError
                const handled = LoginChecker.handleApiError(error, function() {
                    console.log('登录回调被调用');
                    alert('需要登录!');
                });
                
                console.log('handleApiError返回值:', handled);
                document.getElementById('result').innerHTML = '错误: ' + JSON.stringify({
                    hasResponse: !!error.response,
                    status: error.response ? error.response.status : null,
                    data: error.response ? error.response.data : null,
                    handled: handled
                });
            });
        }
    </script>
</body>
</html>
