spring:
  application:
    name: seckill-job
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driverClassName: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/zhu_seckill?serverTimezone=Asia/Shanghai&characterEncoding=utf8&useSSL=false&zeroDateTimeBehavior=convertToNull
    username: root
    password: root
  redis:
    database: 5
    host: 127.0.0.1
    port: 6379
#    password:
    timeout: 50000
  elasticsearch:
    host: 127.0.0.1
    port: 9200
 #   username: elastic
#    password:
  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: admin
    password: admin

server:
  port: 8016
seckill:
  orderApiProperties:
    host: http://127.0.0.1:8011
    createOrderUrl: /v1/web/trade/createForSeckill
    secretKey: zhu1j

