  name-server: 127.0.0.1:9876
  producer:
    group: zhu-seckill-group
    send-message-timeout: 3000
    # 禁用VIP通道，避免端口映射问题
    vip-channel-enabled: false
  # 客户端配置
  client:
    # 强制使用公网地址
    client-ip: 127.0.0.1
logging:
